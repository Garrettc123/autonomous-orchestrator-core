name: Secrets Presence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secrets-presence.yml"
      - "SECRETS.md"

# Values never printed. Missing host keys disarm the loop. They do not
# fail the job: this connector cannot set Actions secrets.
jobs:
  check:
    name: Check required secret names
    runs-on: ubuntu-latest
    steps:
      - name: Presence report
        env:
          COMMANDER_ONE_KEY: ${{ secrets.COMMANDER_ONE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PAYMENT_LINK_URL: ${{ secrets.STRIPE_PAYMENT_LINK_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          disarmed=0
          check() {
            local name="$1" value="$2" role="$3"
            if [ -n "$value" ]; then
              echo "$name PRESENT length=${#value} role=$role"
            else
              echo "$name MISSING role=$role"
              if [ "$role" = "cash" ] || [ "$role" = "flywheel" ]; then
                disarmed=1
              fi
            fi
          }
          check COMMANDER_ONE_KEY "$COMMANDER_ONE_KEY" optional
          check STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY" cash
          check STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET" optional
          check STRIPE_PAYMENT_LINK_URL "$STRIPE_PAYMENT_LINK_URL" optional
          check APOLLO_API_KEY "$APOLLO_API_KEY" optional
          check NOTION_API_KEY "$NOTION_API_KEY" flywheel
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" memory
          check SUPABASE_URL "$SUPABASE_URL" optional
          if [ "$disarmed" -ne 0 ]; then
            echo "DISARMED. Add missing cash/flywheel names at:"
            echo "https://github.com/Garrettc123/autonomous-orchestrator-core/settings/secrets/actions"
            echo "Do not paste values into issues or chat. This run is not cash."
          else
            echo "Named cash and flywheel secrets are present. Values were not logged."
          fi
