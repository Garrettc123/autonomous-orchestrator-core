name: Secrets Presence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secrets-presence.yml"
      - "SECRETS.md"

# Values never printed. Only name + present/missing + length.
jobs:
  check:
    name: Check required secret names
    runs-on: ubuntu-latest
    steps:
      - name: Presence report
        env:
          COMMANDER_ONE_KEY: ${{ secrets.COMMANDER_ONE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PAYMENT_LINK_URL: ${{ secrets.STRIPE_PAYMENT_LINK_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1" value="$2" required="$3"
            if [ -n "$value" ]; then
              echo "$name PRESENT length=${#value}"
            elif [ "$required" = "required" ]; then
              echo "$name MISSING (required)"
              missing=1
            else
              echo "$name MISSING (optional)"
            fi
          }
          check COMMANDER_ONE_KEY "$COMMANDER_ONE_KEY" optional
          check STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY" required
          check STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET" optional
          check STRIPE_PAYMENT_LINK_URL "$STRIPE_PAYMENT_LINK_URL" optional
          check APOLLO_API_KEY "$APOLLO_API_KEY" optional
          if [ "$missing" -ne 0 ]; then
            echo "Contract incomplete. Add the MISSING required name at:"
            echo "https://github.com/Garrettc123/autonomous-orchestrator-core/settings/secrets/actions"
            exit 1
          fi
          echo "Required contract satisfied. Values were not logged."
