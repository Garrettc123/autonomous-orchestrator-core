name: Autonomous Orchestrator Core - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Hourly schedule removed 2026-10-07. It was enqueueing echo jobs that
# died in ~3s with no logs (runner never started) and burned the Actions
# quota. Run this on push or by hand until billing can start a runner.
jobs:
  validate:
    name: "Validate System Orchestration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "Autonomous orchestrator checkout ok"

  test:
    name: "Test Self-Improving Capabilities"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: echo "Python toolchain ok. No cash claim in this job."

  deploy:
    name: "Deploy Orchestrator Core"
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        run: echo "Orchestrator core checked. Production deploy stays host-keyed."

  orchestration-monitor:
    name: "Orchestration Monitor"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Status
        run: |
          echo "AUTONOMOUS ORCHESTRATOR CORE"
          echo "Cash: not claimed here. Stripe paid=true is the only cash signal."
          echo "Live wedge: LLA-47 https://buy.stripe.com/3cI00j7YV0hQgDp8BR43S2v"
