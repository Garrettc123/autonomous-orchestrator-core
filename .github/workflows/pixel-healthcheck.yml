name: Pixel 10 Qwen Health Check

# Schedule removed. `if: false` still created a workflow run every 5 minutes
# (run 2561 and climbing) and starved jobs that need a runner.
# Re-enable the cron only after PIXEL_HEALTHCHECK_ENABLED=1 and the Pixel
# node answers. workflow_dispatch remains for a manual probe.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even if activation gate is not set"
        required: false
        default: "false"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_run == 'true'

    permissions:
      contents: read

    env:
      PIXEL_OLLAMA_URL: ${{ secrets.PIXEL_OLLAMA_URL }}
      PIXEL_HEALTHCHECK_ENABLED: ${{ secrets.PIXEL_HEALTHCHECK_ENABLED }}
      SLACK_HEALTHCHECK_WEBHOOK_URL: ${{ secrets.SLACK_HEALTHCHECK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health check
        run: |
          python -c "
          import json
          from modules.pixel_healthcheck import load_config, is_enabled, run_healthcheck, build_slack_payload, post_to_slack

          config = load_config()
          force = '${{ github.event.inputs.force_run }}' == 'true'
          if not force and not is_enabled(config):
              print('[pixel-healthcheck] Not enabled. Exiting.')
              exit(0)

          result = run_healthcheck(config)
          print(json.dumps(result, indent=2))

          payload = build_slack_payload(
              config,
              result['endpoint'],
              result['latency'],
              result['memory'],
          )
          posted = post_to_slack(config, payload)
          print(f'Slack posted: {posted}')

          if not result['endpoint']['ok']:
              print('::error::Pixel 10 Ollama endpoint is unreachable')
              exit(1)
          "
