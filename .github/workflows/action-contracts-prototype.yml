name: Action contracts prototype

on:
  push:
    branches:
      - implementation/glossary-governance-phase1-20261026
    paths:
      - core/**
      - tests/test_action_contracts.py
      - .github/workflows/action-contracts-prototype.yml

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package import dependency
        run: python -m pip install requests
      - name: Compile prototype and tests
        run: python -m py_compile core/action_contracts.py tests/test_action_contracts.py
      - name: Run prototype suite
        run: python -m unittest discover -s tests -p test_action_contracts.py -v
