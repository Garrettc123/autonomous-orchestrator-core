# RHNS Template Archiver
# Archives a completed engagement into the Notion RHNS Template Library.
# If NOTION_API_KEY is absent the job disarms and exits 0. It does not
# invent a page and it does not print the key.

name: "RHNS Template Archiver"

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: "Template name"
        required: true
        type: string
      vertical:
        description: "Client vertical"
        required: true
        type: choice
        options:
          - General Contractor
          - HVAC
          - Roofing
          - Plumbing
          - Utility
          - Healthcare
          - Energy
          - Manufacturing
          - Engineering Services
          - Construction
          - Other
      revenue_range:
        description: "Client revenue range"
        required: true
        type: choice
        options:
          - "$0-1M"
          - "$1-5M"
          - "$5-10M"
          - "$10-50M"
          - "$50M+"
      client_type:
        description: "Client type"
        required: true
        type: choice
        options:
          - SMB
          - Mid-Market
          - Enterprise
          - Government
      product_used:
        description: "Garcar product used"
        required: true
        type: choice
        options:
          - LLA-47
          - AI-AUDIT-299
          - ENT-AUDIT-3500
          - MARS-750
          - MARS-1500
      engagement_id:
        description: "Unique engagement ID"
        required: false
        type: string
      tags:
        description: "Comma-separated tags"
        required: false
        type: string
      reason:
        description: "RHNS Reason layer"
        required: true
        type: string
      harmony:
        description: "RHNS Harmony layer"
        required: true
        type: string
      navigation:
        description: "RHNS Navigation layer"
        required: true
        type: string
      standards:
        description: "RHNS Standards layer"
        required: true
        type: string
      outcome_summary:
        description: "Quantified engagement outcome. Not cash unless Stripe paid=true."
        required: false
        type: string
      parameters_json:
        description: "Template parameters as JSON"
        required: false
        type: string

  repository_dispatch:
    types: [archive_engagement]

  workflow_call:
    inputs:
      engagement_data_json:
        description: "Full engagement data as JSON string"
        required: true
        type: string
    secrets:
      NOTION_API_KEY:
        required: false

jobs:
  archive:
    name: "Archive RHNS Template"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Disarm if Notion key missing
        id: gate
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RHNS archiver DISARMED. Add NOTION_API_KEY at repo Actions secrets. Do not paste it into an issue."
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build engagement data
        id: build_data
        if: steps.gate.outputs.armed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "source=repository_dispatch" >> "$GITHUB_OUTPUT"
            cat << 'PAYLOAD_EOF' > /tmp/engagement.json
          ${{ toJson(github.event.client_payload) }}
          PAYLOAD_EOF
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "source=workflow_call" >> "$GITHUB_OUTPUT"
            cat << 'PAYLOAD_EOF' > /tmp/engagement.json
          ${{ inputs.engagement_data_json }}
          PAYLOAD_EOF
          else
            echo "source=workflow_dispatch" >> "$GITHUB_OUTPUT"
            python3 -c "
          import json
          tags_raw = '''${{ inputs.tags }}'''
          tags = [t.strip() for t in tags_raw.split(',') if t.strip()] if tags_raw else []
          params_raw = '''${{ inputs.parameters_json }}'''
          try:
              params = json.loads(params_raw) if params_raw else {}
          except json.JSONDecodeError:
              params = {}
          data = {
              'template_name': '''${{ inputs.template_name }}''',
              'vertical': '''${{ inputs.vertical }}''',
              'revenue_range': '''${{ inputs.revenue_range }}''',
              'client_type': '''${{ inputs.client_type }}''',
              'product_used': '''${{ inputs.product_used }}''',
              'engagement_id': '''${{ inputs.engagement_id }}''' or None,
              'tags': tags,
              'reason': '''${{ inputs.reason }}''',
              'harmony': '''${{ inputs.harmony }}''',
              'navigation': '''${{ inputs.navigation }}''',
              'standards': '''${{ inputs.standards }}''',
              'outcome_summary': '''${{ inputs.outcome_summary }}''' or None,
              'parameters': params,
              'status': 'Active Template',
          }
          data = {k: v for k, v in data.items() if v is not None}
          with open('/tmp/engagement.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          "
          fi

      - name: Validate engagement data
        if: steps.gate.outputs.armed == 'true'
        run: |
          python3 -c "
          import json, sys
          with open('/tmp/engagement.json') as f:
              data = json.load(f)
          print(json.dumps(data, indent=2))
          if 'template_name' not in data:
              print('ERROR: template_name is required', file=sys.stderr)
              sys.exit(1)
          print('Validation passed.')
          "

      - name: Archive RHNS template to Notion
        id: archive
        if: steps.gate.outputs.armed == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          python3 scripts/archive_rhns_template.py --file /tmp/engagement.json

      - name: Generate workflow summary
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.armed }}" != "true" ]; then
            echo "## RHNS archiver DISARMED" >> $GITHUB_STEP_SUMMARY
            echo "NOTION_API_KEY is missing. No page was written." >> $GITHUB_STEP_SUMMARY
            echo "Add the secret in repo settings. Do not paste it here." >> $GITHUB_STEP_SUMMARY
          else
            echo "## RHNS Template Archived" >> $GITHUB_STEP_SUMMARY
            echo "| Template | ${{ steps.archive.outputs.template_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Page URL | ${{ steps.archive.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          fi
